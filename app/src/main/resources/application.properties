# ===================================================================
# StockSphere - Retail Inventory Management System
# Agile Capstone Case Study Backend Configuration
# ===================================================================

spring.application.name=StockSphere
server.port=8080

# Default Database Profile: In-Memory H2 for Zero-Friction Instant Startup
# (To use PostgreSQL, run with: --spring.profiles.active=postgres or use docker-compose)
spring.datasource.url=jdbc:h2:mem:stockspheredb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging Configuration
logging.level.com.retail.app=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
