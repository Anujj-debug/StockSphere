
services:
  db:
    image: postgres:16-alpine
    container_name: stocksphere-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: stocksphere_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stocksphere_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - stocksphere-net

  backend:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: stocksphere-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://stocksphere-db:5432/stocksphere_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    volumes:
      - backend_logs:/app/logs
    networks:
      - stocksphere-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stocksphere-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"
      - "80:80"
    networks:
      - stocksphere-net

networks:
  stocksphere-net:
    driver: bridge

volumes:
  postgres_data:
  backend_logs:
